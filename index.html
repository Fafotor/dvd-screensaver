#msg{position:absolute;left:0;right:0;top:55%;text-align:center;font:700 clamp(14px,3vw,30px) system-ui;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;display:none}
#panel{position:fixed;right:10px;top:50%;transform:translateY(-50%);width:220px;max-height:92vh;overflow:auto;padding:12px;border-radius:14px;background:rgba(15,25,60,.86);color:#fff;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.35);z-index:5;box-sizing:border-box}
#panel.min{width:auto;padding:8px 12px}#panel.min .body{display:none}
#hd{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:12px;cursor:pointer}
.body{margin-top:8px}
label{display:block;margin:9px 0 3px}label span{float:right;opacity:.7}
input[type=range]{width:100%;margin:0}input[type=color]{width:100%;height:28px;border:0;padding:0;background:none}
select,button{width:100%;padding:7px;border-radius:8px;border:0;font-size:13px;margin-top:6px}
button{background:#2a5bd7;color:#fff;cursor:pointer}
.row{display:flex;gap:6px;align-items:center;margin-top:9px}
#hud{margin-top:8px;padding:8px;background:rgba(255,255,255,.1);border-radius:8px;line-height:1.5}
small{opacity:.65}
#lvb{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,30,.6);color:#fff;font-size:clamp(14px,2.4vw,22px);text-align:center;z-index:3}
#lvb button{width:min(80%,360px);padding:12px;font-size:inherit;margin:0}
body[data-g=rpg] #tc{justify-content:flex-end}body[data-g=rpg] #bl,body[data-g=rpg] #br2,body[data-g=rpg] #bn{display:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9}
.lbc{width:min(92vw,440px);max-height:90vh;overflow:auto;background:#0f193c;color:#fff;padding:14px;border-radius:14px;font-size:14px}
#lbt{display:flex;flex-wrap:wrap;gap:4px}#lbt button{width:auto;flex:1;padding:6px;margin:0;background:#334}#lbt .on{background:#2a5bd7}
#lbl{margin:10px 0;line-height:1.7;min-height:80px}#lbn{opacity:.6;font-size:11px;margin-bottom:8px}
#lbsub{display:none;margin-top:10px;padding:8px;background:rgba(255,255,255,.1);border-radius:8px}#nm{width:100%;box-sizing:border-box;padding:8px;margin:6px 0;border-radius:8px;border:0}
#tc{position:fixed;left:0;right:0;bottom:0;display:none;gap:10px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:4;pointer-events:none}
@media (pointer:coarse){body[data-g=pin] #tc{display:flex}}
.fb{pointer-events:auto;flex:1;height:22vh;min-height:64px;font-size:22px;background:rgba(15,25,60,.55);border:2px solid rgba(255,255,255,.6);color:#fff;border-radius:18px;margin:0;touch-action:none}
.fb:active{background:rgba(42,91,215,.85)}
.mid{flex:.8;display:flex;flex-direction:column;gap:8px}.mid .fb{height:auto;flex:1;min-height:0;font-size:15px}
#hint{display:none;position:fixed;top:6px;left:50%;transform:translateX(-50%);background:rgba(15,25,60,.85);color:#fff;font-size:12px;padding:6px 10px;border-radius:10px;z-index:6}
@media (pointer:coarse) and (orientation:portrait){#hint{display:block}}

 if(st.on&&st.gi>0){const c=st.gm==='fixed'?st.color:'hsl('+hue+',100%,55%)',r=4+st.gi*.3;f='drop-shadow(0 0 '+r+'px '+c+') drop-shadow(0 0 '+r*1.8+'px '+c+')'}

function mk(x,y,a,hits){
 const el=document.createElement('div');el.className='o';
 el.innerHTML='<img alt=""><span class="hat"></span>';el.firstChild.src=SRC;field.appendChild(el);
 const o={el,hat:el.lastChild,x,y,dx:Math.cos(a),dy:Math.sin(a),hits,lv:-1,rot:0};

}
function setHat(o){const l=lvl(o.hits);if(l!==o.lv){o.lv=l;o.hat.textContent=HATS[l][0];o.el.classList.toggle('king',l===5)}}
function hit(o,spawn,mx,my){
 o.hits++;total++;setHat(o);
 if(st.gm==='auto')hue=(hue+67)%360;glow();
 if(spawn&&st.multi&&objs.length<st.max){
  const c=mk(o.x,o.y,0,o.hits);c.dx=mx*o.dx;c.dy=my*o.dy;
  if(Math.abs(c.dx)<.15)c.dx=.3*(Math.random()<.5?-1:1);
  const m=Math.hypot(c.dx,c.dy);c.dx/=m;c.dy/=m;
 }
}
function turn(o,a){const t=Math.atan2(o.dy,o.dx)+a;o.dx=Math.cos(t);o.dy=Math.sin(t);
 if(Math.abs(o.dx)<.2)o.dx=.2*(Math.sign(o.dx)||1);if(Math.abs(o.dy)<.2)o.dy=.2*(Math.sign(o.dy)||1);
 const m=Math.hypot(o.dx,o.dy);o.dx/=m;o.dy/=m}

function dvd(dt,W,H){
 const w=st.size/100*H,pad=.26*w,c=st.chaos/100;
 for(const o of objs.slice()){
  if(c)turn(o,(Math.random()-.5)*c*dt*8);
  o.x+=o.dx*st.sp*dt;o.y+=o.dy*st.sp*dt;let sx=0,sy=0;
  if(o.x<=0){o.x=0;sx=1}else if(o.x+w>=W){o.x=W-w;sx=-1}
  if(o.y<=pad){o.y=pad;sy=1}else if(o.y+w>=H){o.y=H-w;sy=-1}
  if(sx||sy){if(c)turn(o,(Math.random()-.5)*c*1.2);fix(o,sx,sy);hit(o,true,sx?1:-1,sx?-1:1)}
 }
}

 const R=rng(ark.level*7919+13),rows=Math.min(4+(ark.level>>1),8),type=Math.floor(R()*5),dens=.55+R()*.3;
 const rnd=Array.from({length:rows},()=>Array.from({length:5},R));ark.name=PN[type];
 for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++){
  const cc=Math.min(c,COLS-1-c);let on;
  if(type===0)on=rnd[r][cc]<dens;else if(type===1)on=(r+c)%2===0;
  else if(type===2)on=cc>=Math.floor((rows-1-r)*.8);else if(type===3)on=r%2===0;
  else on=Math.abs(c-4.5)+Math.abs(r-(rows-1)/2)*1.3<=5;
  if(!on&&!(r===0&&c===0&&false))continue;
  const hp=R()<Math.min(.6,ark.level*.08)?(ark.level>3&&R()<.3?3:2):1;
  const el=document.createElement('div');el.className='br';const L=18+c*6.4,T=7+r*4.2;
  el.style.cssText='left:'+L+'%;top:'+T+'%;width:6%;height:3.6%';
  brEl.appendChild(el);const b={el,L,T,hp,r};paint(b);ark.bricks.push(b);

}

   let a=cl((cx-(pl+pw/2))/(pw/2),-1,1)*1.05;if(Math.abs(a)<.15)a=.15*(Math.random()<.5?-1:1);

   if(o.x<=0){o.x=0;o.dx=Math.abs(o.dx)}else if(o.x+w>=W){o.x=W-w;o.dx=-Math.abs(o.dx)}
   if(o.y<=.2*w){o.y=.2*w;o.dy=Math.abs(o.dy)}else if(o.y+w>=H*.75){o.y=H*.75-w;o.dy=-Math.abs(o.dy)}

function seg(o,ax,ay,bx,by,th,wv,px,py){

 if(d>=R||!d)return 0;
 const nx=dx/d,ny=dy/d;o.cx+=nx*(R-d);o.cy+=ny*(R-d);
 const vn=(o.vx+wv*(qy-py))*nx+(o.vy-wv*(qx-px))*ny;
 if(vn<0){o.vx-=1.5*vn*nx;o.vy-=1.5*vn*ny}
 return 1;
}

}
/* ---------- Таблица лидеров ---------- */
const LBM=[['dvd','DVD'],['ark','Арканоид'],['duck','Duck Hunt'],['pin','Пинбол'],['rpg','Выживание']];
const mult=(m,sp,sz)=>+Math.min(4,Math.max(.3,Math.pow(sp/200,.6)*Math.pow(m==='rpg'?sz/22:22/sz,.6))).toFixed(2);
const raw=()=>{const g=st.game;return g==='dvd'?total:g==='ark'?ark.score+ark.level*50:g==='duck'?dk.score:g==='pin'?pn.score:rp.kills*10+rp.wave*100+rp.lvl*50};
const isOver=()=>{const g=st.game;return g==='ark'&&ark.state==='over'||g==='duck'&&dk.state==='over'||g==='pin'&&pn.state==='over'||g==='rpg'&&rp.state==='over'};
const lbOpen=()=>$('lb').style.display==='flex';
let pend=null,shown=false,lbTab='dvd';
const mkp=()=>({mode:st.game,raw:raw(),sp:st.sp,sz:st.size});
function openLb(m,p){lbTab=m;pend=p;$('lb').style.display='flex';renderLb()}
async function renderLb(){
 const t=$('lbt');t.innerHTML='';
 LBM.forEach(([m,n])=>{const b=document.createElement('button');b.textContent=n;b.className=m===lbTab?'on':'';b.onclick=()=>{lbTab=m;renderLb()};t.appendChild(b)});
 $('lbsub').style.display=pend?'block':'none';
 if(pend)$('lbs').textContent='Результат: '+pend.raw+' × '+mult(pend.mode,pend.sp,pend.sz)+' = '+Math.round(pend.raw*mult(pend.mode,pend.sp,pend.sz))+' (скорость '+pend.sp+', размер '+pend.sz+')';
 let rows,note='';
 try{const r=await fetch(API+'/api/scores?mode='+lbTab);if(!r.ok)throw 0;rows=await r.json()}catch(e){rows=JSON.parse(localStorage.getItem('lb_'+lbTab)||'[]');note='Сервер недоступен — показана локальная таблица'}
 const L=$('lbl');L.innerHTML='';
 rows.slice(0,15).forEach((r,i)=>{const d=document.createElement('div');d.textContent=(i+1)+'. '+r.n+' — '+r.s+'  (×'+r.m+')';L.appendChild(d)});
 if(!rows.length)L.textContent='Пока пусто — стань первым!';
 $('lbn').textContent=note+(note?' · ':'')+'Очки = результат × множитель: быстрее и мельче = больше (в «Выживании» мельче = меньше).';
}
$('sbtn').onclick=async()=>{
 const n=($('nm').value||'Аноним').slice(0,16);localStorage.setItem('nm',n);const b={...pend,name:n};pend=null;
 try{const r=await fetch(API+'/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw 0}
 catch(e){const k='lb_'+b.mode,a=JSON.parse(localStorage.getItem(k)||'[]'),m=mult(b.mode,b.sp,b.sz);a.push({n,s:Math.round(b.raw*m),m});a.sort((x,y)=>y.s-x.s);localStorage.setItem(k,JSON.stringify(a.slice(0,20)))}
 renderLb();
};
$('lbx').onclick=()=>{$('lb').style.display='none'};
$('lbo').onclick=()=>openLb(st.game,null);
$('lbv').onclick=()=>openLb(st.game,mkp());
$('nm').value=localStorage.getItem('nm')||'';
/* ---------- общее ---------- */
function setGame(g){
 st.game=g;stage.dataset.g=g;document.body.dataset.g=g;clear();total=0;say('');$('lvb').style.display='none';$('bgo').textContent=g==='rpg'?'⚡ рывок':'▶ запуск';
 if(g==='dvd')mk(60,60,Math.PI/4,0);else if(g==='ark')newArk();else if(g==='duck')newDuck();else if(g==='rpg')newRpg();else newPin();
}
function launch(){
 const g=st.game;
 if(g==='rpg'){if(rp.state==='over')return newRpg();if(rp.state==='play'&&rp.dc<=0){rp.dc=1.2*rp.dcm;rp.dr=.22;rp.iv=.4}return}
 if(g==='ark'){
  if(ark.state==='over')return newArk();
  if(ark.state==='ready'&&objs[0]){const a=(Math.random()-.5);objs[0].dx=Math.sin(a)||.3;objs[0].dy=-Math.cos(a);ark.state='play';say('')}
 }else if(g==='pin'){
  if(pn.state==='over')return newPin();
  if(pn.state==='ready'&&objs[0]){objs[0].vx=(Math.random()-.5)*400;objs[0].vy=150;pn.state='play';pn.saver=8;say('')}
 }else if(g==='duck'&&dk.state==='over')newDuck();
}
function tick(t){
 const dt=Math.min((t-last)/1000,.05);last=t;
 const W=stage.clientWidth,H=stage.clientHeight,g=st.game,s=W/LW,T=t/1000;
 if(st.gm==='rainbow'&&!paused){hue=(hue+dt*60)%360;glow()}
 if(!paused&&!lbOpen()){if(g==='dvd')dvd(dt,W,H);else if(g==='ark')arkT(dt,W,H);else if(g==='duck')duckT(dt,W,H,T);else if(g==='rpg')rpgT(dt,s);else pinT(dt,s)}
 if(isOver()){if(!shown){shown=true;openLb(g,mkp())}}else shown=false;
 const w=st.size/100*H*{dvd:1,ark:.5,duck:.8,pin:.4,rpg:.5}[g];
 if(g==='rpg'&&rp.o){rp.o.cx=rp.x;rp.o.cy=rp.y;rp.o.el.style.opacity=rp.iv>0&&Math.floor(T*20)%2?.4:rp.dr>0?.6:1;rpgDraw(W,H,s)}
 for(const o of objs){
  const lg=(g==='pin'||g==='rpg')&&o.cx!==undefined,x=lg?o.cx*s-w/2:o.x,y=lg?o.cy*s-w/2:o.y;
  o.el.style.width=w+'px';o.el.style.fontSize=w+'px';
  o.el.style.transform='translate('+x+'px,'+y+'px) rotate('+(o.rot||0)+'deg)';
 }
 if(g==='ark')pad_.style.left=(ark.px*100-8)+'%';
 if(g==='pin')flipPts().forEach(([p,tx,ty],k)=>{const e=$(k?'fr':'fl');e.setAttribute('x1',p[0]);e.setAttribute('y1',p[1]);e.setAttribute('x2',tx);e.setAttribute('y2',ty)});
 if(g==='pin'){TX.forEach((_,i)=>$('tg'+i).style.opacity=pn.tg[i]?1:.15);const e=$('spn'),cx=SPV[2]*Math.cos(pn.spin),cy=SPV[2]*Math.sin(pn.spin);e.setAttribute('x1',SPV[0]+cx);e.setAttribute('y1',SPV[1]+cy);e.setAttribute('x2',SPV[0]-cx);e.setAttribute('y2',SPV[1]-cy)}
 let best=0;objs.forEach(o=>{best=Math.max(best,o.hits)});
 if(!objs.length)best=g==='ark'?ark.carry:g==='pin'?pn.carry:g==='duck'?dk.kills:0;
 const l=lvl(best),nx=HATS[l+1];
 const top=g==='rpg'?'Ур. '+rp.lvl+' · Волна '+rp.wave+' · Убито '+rp.kills+'<br>HP '+Math.max(0,Math.ceil(rp.hp))+'/'+rp.max+' · Рывок '+(rp.dc>0?rp.dc.toFixed(1)+'с':'готов'):g==='dvd'?'Удары: '+total+' · Объектов: '+objs.length
  :g==='ark'?'Очки: '+ark.score+' · Жизни: '+'❤'.repeat(Math.max(0,ark.lives))+'<br>Уровень '+ark.level+': '+ark.name
  :g==='duck'?'Очки: '+dk.score+' · Раунд: '+dk.round+'<br>Патроны: '+'●'.repeat(dk.ammo)+' · Жизни: '+'❤'.repeat(Math.max(0,dk.lives))
  :'Очки: '+pn.score+' ×'+pn.mult+' · Шары: '+'●'.repeat(Math.max(0,pn.balls))+'<br>Объектов: '+objs.length+(pn.saver>0?' · Спасатель '+pn.saver.toFixed(0):'');
 $('hud').innerHTML=top+'<br>Множитель очков: ×'+mult(g,st.sp,st.size)+'<br>Шапка: '+(HATS[l][0]||'—')+' (ур. '+l+')'+(nx?' · до '+nx[0]+': '+Math.max(0,nx[1]-best):' · максимум!');
 requestAnimationFrame(tick);
}
const bind=(id,fn,ev)=>$(id)[ev||'oninput']=fn;
bind('sp',e=>{st.sp=+e.target.value;$('spv').textContent=st.sp});
bind('ch',e=>{st.chaos=+e.target.value;$('chv').textContent=st.chaos});
bind('sz',e=>{st.size=+e.target.value;$('szv').textContent=st.size});
bind('mx',e=>{st.max=+e.target.value;$('mxv').textContent=st.max});
bind('gi',e=>{st.gi=+e.target.value;$('giv').textContent=st.gi;glow()});
bind('mu',e=>{st.multi=e.target.checked},'onchange');
bind('gl',e=>{st.on=e.target.checked;glow()},'onchange');
bind('gm',e=>{st.gm=e.target.value;$('gc').style.display=st.gm==='fixed'?'block':'none';glow()},'onchange');
bind('gc',e=>{st.color=e.target.value;glow()});
bind('gm0',e=>setGame(e.target.value),'onchange');
$('pb').onclick=()=>{paused=!paused;$('pb').textContent=paused?'Продолжить':'Пауза'};
$('rs').onclick=()=>setGame(st.game);
$('hd').onclick=()=>{const m=$('panel').classList.toggle('min');$('tg').textContent=m?'+':'–'};
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();ark.px=cl((e.clientX-r.left)/r.width,.08,.92)});
stage.addEventListener('pointerdown',e=>{
 const r=stage.getBoundingClientRect(),g=st.game;
 if(g==='rpg'){if(rp.state==='over')launch();else{rp.jd=1;rp.ax=rp.jx=(e.clientX-r.left)/r.width*LW;rp.ay=rp.jy=(e.clientY-r.top)/r.height*LH}}else if(g==='duck'){dk.state==='over'?launch():shoot(e.clientX-r.left,e.clientY-r.top)}
 else if(g==='pin'&&pn.state==='play')pset(e.pointerId,e.clientX-r.left<r.width/2?'L':'R');
 else launch();
});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,e=>{delete pm[e.pointerId];pset('_',0)}));
[['bl','L'],['br2','R']].forEach(([id,s])=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();pset(e.pointerId,s)}));
$('bn').addEventListener('pointerdown',e=>{e.preventDefault();nudge()});
$('bgo').addEventListener('pointerdown',e=>{e.preventDefault();launch()});
function onOri(e){const a=(screen.orientation&&screen.orientation.angle)||0;const v=a===90?e.beta:(a===270||a===-90)?-e.beta:a===180?-e.gamma:e.gamma;tilt.x=cl(v||0,-45,45)}
$('tl').onchange=async e=>{
 if(e.target.checked){try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission&&await DeviceOrientationEvent.requestPermission()!=='granted'){e.target.checked=false;return}addEventListener('deviceorientation',onOri);tilt.on=1}catch(_){e.target.checked=false}}
 else{removeEventListener('deviceorientation',onOri);tilt.on=0}
};
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
stage.addEventListener('pointermove',e=>{if(rp.jd){const r=stage.getBoundingClientRect();rp.jx=(e.clientX-r.left)/r.width*LW;rp.jy=(e.clientY-r.top)/r.height*LH}});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>{rp.jd=0}));
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;if((e.code==='ArrowUp'||e.code==='KeyN')&&!e.repeat)nudge();if(e.code==='Space'){e.preventDefault();launch()}});
addEventListener('keyup',e=>{keys[e.code]=false});
if(innerWidth<700)$('hd').onclick();
['sp','sz','mx','ch'].forEach(i=>$(i).oninput({target:$(i)}));
glow();setGame('dvd');requestAnimationFrame(tick);
</script></body></html>
